<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>うちゅうじんカメラ</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="gl"></canvas>
</div>

<div id="top">
  <button class="round" id="reload" aria-label="再読み込み">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
  </button>
  <button class="pill" id="safariBtn">Safari用リンク</button>
</div>

<div id="hint"></div>
<div id="toast"></div>
<div id="flash"></div>

<div id="mid">
  <!-- iPhone/iPad: AR Quick Look。a[rel=ar] の子は img だけにする(仕様) -->
  <div id="arWrap">
    <a id="arLink" rel="ar" href="./assets/alien-ar.usdz"><img src="./assets/ar-icon.png" alt="ARで床に置く"></a>
    <span>床に置いて歩く(AR)</span>
  </div>
  <button class="pill" id="arBtn" style="display:none">床に置いて歩く(AR)</button>
  <button class="pill" id="replaceBtn">置き直す</button>
</div>

<div id="bar">
  <button id="thumb" aria-label="直近の写真"></button>
  <button id="shutter" aria-label="撮影"></button>
  <button class="round" id="flip" aria-label="内カメ/外カメ切り替え">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8a8 8 0 0 0-14-2L4 8"/><path d="M4 4v4h4"/><path d="M4 16a8 8 0 0 0 14 2l2-2"/><path d="M20 20v-4h-4"/></svg>
  </button>
</div>

<!-- WebXR(dom-overlay)用 -->
<div id="xrOverlay">
  <div id="xrTouch"></div>
  <div id="xrHint"></div>
  <div class="top"><button class="pill" id="xrExit">終了</button></div>
  <div class="bottom"><button class="pill" id="xrReplace">置き直す</button></div>
</div>

<div class="modal" id="preview">
  <img id="pvImg" alt="撮影した写真">
  <div class="row"><button class="main" id="saveBtn">保存 / 共有</button><button class="sub" id="backBtn">撮影へ戻る</button></div>
  <small>保存できないときは、写真を長押ししてください</small>
</div>

<div class="modal" id="linkDlg">
  <div>iPhoneのSafariで開くと、床に置くARが使えます。<br>下のリンクをコピーして、Safariのアドレス欄に貼り付けてください。</div>
  <input id="linkIn" readonly>
  <div class="row"><button class="main" id="copyBtn">コピー</button><button class="sub" id="linkClose">閉じる</button></div>
</div>

<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
